<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinais de Aviador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 42px;
            color: #ffc107;
            margin-bottom: 16px;
        }
        p {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 40px;
        }
        .caixa {
            background: #222;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
            border: 2px solid #ffc107;
        }
        .botao {
            display: block;
            width: 100%;
            padding: 16px;
            background: #ffc107;
            color: #111;
            font-weight: bold;
            font-size: 18px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <h1>✈️ Sinais de Aviador</h1>
        <p>Aplicativo de análise e estratégia</p>
        <a class="botao" href="#">Receber Sinal</a>
    </div>
</body>
</html>

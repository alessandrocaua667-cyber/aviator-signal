<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinais Aviator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .caixa {
            max-width: 440px;
            margin: 0 auto;
        }
        h1 {
            color: #facc15;
            font-size: 30px;
            margin-bottom: 8px;
        }
        .aviso {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .botao-like {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #141b2d;
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .botao-like.ativo {
            border-color: #ef4444;
            background: #ef444422;
        }
        .coracao {
            font-size: 26px;
        }
        .campo-link, .selecao-aviator {
            background: #141b2d;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .selecao-aviator h3, .campo-link h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .card-sinal {
            background: #141b2d;
            border: 2px solid #facc15;
            border-radius: 22px;
            padding: 35px 20px;
            margin-bottom: 25px;
        }
        .label {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .valor {
            font-size: 56px;
            font-weight: bold;
            color: #22c55e;
            margin-bottom: 25px;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
            cursor: pointer;
        }
        .btn-auto {
            background: #8b5cf6;
            color: #fff;
        }
        .btn-parar {
            background: #f97316;
            color: #000;
        }
        .btn-limpar {
            background: #ef4444;
            color: #fff;
        }
        .card-hist {
            background: #141b2d;
            border-radius: 18px;
            padding: 20px;
            text-align: left;
        }
        .card-hist h3 {
            color: #facc15;
            margin-bottom: 12px;
        }
        .item {
            padding: 7px 0;
            border-bottom: 1px solid #273556;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <h1>✈️ Sinais Aviator</h1>
        <p class="aviso">Estimativa estatística — não é garantia de resultado</p>

        <!-- BOTÃO DE LIKE ❤️ -->
        <div class="botao-like" id="btnLike" onclick="curtir()">
            <span class="coracao" id="coracao">🤍</span>
            <span>Curtir: <span id="contadorLike">0</span></span>
        </div>

        <!-- ESCOLHER QUAL AVIATOR VOCÊ ESTÁ OPERANDO -->
        <div class="selecao-aviator">
            <h3>🎮 Qual Aviator eu tô operando?</h3>
            <select id="tipoAviator">
                <option value="">Selecione...</option>
                <option value="Aviator 1">Aviator 1</option>
                <option value="Aviator 2">Aviator 2</option>
                <option value="VIP">VIP</option>
                <option value="Demo">Demo</option>
            </select>
        </div>

        <!-- BARRA PARA COLOCAR O LINK DA PLATAFORMA -->
        <div class="campo-link">
            <h3>🔗 Link da sua plataforma</h3>
            <input type="text" id="linkPlataforma" placeholder="Cole aqui o link da plataforma...">
        </div>

        <div class="card-sinal">
            <p class="label">Momento estimado de quebra:</p>
            <div class="valor" id="sinal">--</div>
            <button class="btn-auto" onclick="iniciarAutomatico()">▶️ Rodar Sinais Automáticos</button>
            <button class="btn-parar" onclick="pararAutomatico()">⏹️ Parar</button>
            <button class="btn-limpar" onclick="apagarTudo()">🗑️ Limpar Histórico</button>
        </div>

        <div class="card-hist">
            <h3>📜 Histórico</h3>
            <div id="historico"></div>
        </div>
    </div>

    <script>
        const campoSinal = document.getElementById("sinal");
        const campoHist = document.getElementById("historico");
        const contadorLike = document.getElementById("contadorLike");
        const coracao = document.getElementById("coracao");
        const btnLike = document.getElementById("btnLike");
        const tipoAviator = document.getElementById("tipoAviator");

        let likes = 0;
        let idTimer = null;

        function curtir() {
            likes++;
            contadorLike.innerText = likes;
            coracao.innerText = "❤️";
            btnLike.classList.add("ativo");
        }

        function gerarSinal() {
            let min, max;
            const escolha = tipoAviator.value;

            // Ajusta o range do sinal conforme o tipo de Aviator
            if (escolha === "Aviator 1") {
                min = 1.10;
                max = 10.00;
            } else if (escolha === "Aviator 2") {
                min = 1.10;
                max = 12.00;
            } else if (escolha === "VIP") {
                min = 1.50;
                max = 15.00;
            } else if (escolha === "Demo") {
                min = 1.10;
                max = 8.00;
            } else {
                min = 1.10;
                max = 10.00;
            }

            const num = (Math.random() * (max - min) + min).toFixed(2);
            campoSinal.innerText = num + "x";

            const hora = new Date().toLocaleTimeString("pt-BR");
            const linha = document.createElement("div");
            linha.className = "item";
            linha.innerText = `${hora} | ${escolha || "Não selecionado"} | ${num}x`;
            campoHist.prepend(linha);
        }

        function iniciarAutomatico() {
            if (idTimer) return;
            gerarSinal();
            idTimer = setInterval(gerarSinal, 10000);
        }

        function pararAutomatico() {
            clearInterval(idTimer);
            idTimer = null;
        }

        function apagarTudo() {
            campoSinal.innerText = "--";
            campoHist.innerHTML = "";
            pararAutomatico();
        }
    </script>
</body>
</html>

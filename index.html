<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #121212;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        h1 {
            color: #facc15;
            font-size: 24px;
            text-align: center;
            margin-bottom: 6px;
        }
        .aviso {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
        }
        .botao-like {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #202020;
            border: 2px solid #ef4444;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .botao-like.ativo {
            border-color: #ef4444;
            background: #ef444422;
        }
        .coracao {
            font-size: 24px;
        }
        .selecao-aviator, .campo-link {
            background: #202020;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .selecao-aviator h3, .campo-link h3 {
            color: #38bdf8;
            font-size: 14px;
            margin-bottom: 8px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }
        /* HISTÓRICO DE VELAS NO TOPO */
        .topo-historico {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 12px;
        }
        .v {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }
        .v.azul { color:#38bdf8; }
        .v.roxo { color:#a855f7; }
        .v.rosa { color:#fb7185; }

        /* TELA PRINCIPAL DO JOGO */
        .tela-jogo {
            position: relative;
            height: 300px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .raios {
            position: absolute;
            inset:0;
            background: repeating-conic-gradient(from 220deg, transparent 0deg 12deg, #222 12deg 24deg);
            opacity: 0.6;
        }
        .multi-grande {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: #fff;
            z-index: 10;
        }
        .aviao-vermelho {
            position: absolute;
            font-size: 46px;
            z-index: 20;
            transition: all 2.5s ease-out;
        }

        /* BLOCOS DE APOSTA */
        .bloco-aposta {
            background: #202020;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .cabecalho-aposta {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .tab {
            flex:1;
            text-align:center;
            padding:7px;
            border-radius:8px;
            background:#333;
        }
        .tab.ativo {
            background:#444;
        }
        .linha-valor {
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin:10px 0;
        }
        .botao-menos, .botao-mais {
            width:36px;
            height:36px;
            border-radius:50%;
            border:none;
            font-size:20px;
        }
        .valor-aposta {
            font-size:24px;
            font-weight:bold;
        }
        .botoes-rapidos {
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:6px;
            margin-bottom:10px;
        }
        .btn-rapido {
            padding:7px;
            border-radius:8px;
            border:none;
        }
        .btn-aposta-verde {
            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            background:#22c55e;
            font-size:20px;
            font-weight:bold;
            color:#000;
        }

        /* BOTÕES DE CONTROLE DOS SINAIS */
        .botoes-controle {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .botoes-controle button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-auto { background: #8b5cf6; color:#fff; }
        .btn-parar { background: #f97316; color:#000; }
        .btn-limpar { background: #ef4444; color:#fff; }

        /* HISTÓRICO PESSOAL */
        .card-hist {
            background: #202020;
            border-radius: 14px;
            padding: 14px;
            text-align: left;
        }
        .card-hist h3 {
            color: #facc15;
            margin-bottom: 10px;
        }
        .item {
            padding: 6px 0;
            border-bottom: 1px solid #333;
            color: #ddd;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>✈️ Sinais Aviator</h1>
    <p class="aviso">Estimativa estatística — não é garantia de resultado</p>

    <!-- BOTÃO DE LIKE ❤️ -->
    <div class="botao-like" id="btnLike" onclick="curtir()">
        <span class="coracao" id="coracao">🤍</span>
        <span>Curtir: <span id="contadorLike">0</span></span>
    </div>

    <!-- SELECIONAR QUAL AVIATOR -->
    <div class="selecao-aviator">
        <h3>🎮 Qual Aviator eu tô operando?</h3>
        <select id="tipoAviator">
            <option value="">Selecione...</option>
            <option value="Aviator 1">Aviator 1</option>
            <option value="Aviator 2">Aviator 2</option>
            <option value="VIP">VIP</option>
            <option value="Demo">Demo</option>
        </select>
    </div>

    <!-- LINK DA PLATAFORMA -->
    <div class="campo-link">
        <h3>🔗 Link da sua plataforma</h3>
        <input type="text" id="linkPlataforma" placeholder="Cole aqui o link da plataforma...">
    </div>

    <!-- HISTÓRICO DAS VELAS NO TOPO (igual o jogo) -->
    <div class="topo-historico" id="topoVelas"></div>

    <!-- TELA DO AVIATOR IGUAL A FOTO -->
    <div class="tela-jogo">
        <div class="raios"></div>
        <div class="multi-grande" id="multi">0.00x</div>
        <div class="aviao-vermelho" id="aviao">✈️</div>
    </div>

    <!-- DOIS BLOCOS DE APOSTA -->
    <div class="bloco-aposta">
        <div class="cabecalho-aposta">
            <div class="tab ativo">Aposta</div>
            <div class="tab">Automático</div>
        </div>
        <div class="linha-valor">
            <button class="botao-menos">-</button>
            <span class="valor-aposta">1.00</span>
            <button class="botao-mais">+</button>
        </div>
        <div class="botoes-rapidos">
            <button class="btn-rapido">10</button>
            <button class="btn-rapido">20</button>
            <button class="btn-rapido">50</button>
            <button class="btn-rapido">100</button>
        </div>
        <button class="btn-aposta-verde">Aposta 1.00 BRL</button>
    </div>

    <div class="bloco-aposta">
        <div class="cabecalho-aposta">
            <div class="tab ativo">Aposta</div>
            <div class="tab">Automático</div>
        </div>
        <div class="linha-valor">
            <button class="botao-menos">-</button>
            <span class="valor-aposta">1.00</span>
            <button class="botao-mais">+</button>
        </div>
        <div class="botoes-rapidos">
            <button class="btn-rapido">10</button>
            <button class="btn-rapido">20</button>
            <button class="btn-rapido">50</button>
            <button class="btn-rapido">100</button>
        </div>
        <button class="btn-aposta-verde">Aposta 1.00 BRL</button>
    </div>

    <!-- BOTÕES DOS SINAIS -->
    <div class="botoes-controle">
        <button class="btn-auto" onclick="iniciarAutomatico()">▶️ Auto</button>
        <button class="btn-parar" onclick="pararAutomatico()">⏹️ Parar</button>
        <button class="btn-limpar" onclick="apagarTudo()">🗑️ Limpar</button>
    </div>

    <!-- MEU HISTÓRICO DE SINAIS -->
    <div class="card-hist">
        <h3>📝 Meu histórico de sinais</h3>
        <div id="historico"></div>
    </div>

<script>
    const aviao = document.getElementById("aviao");
    const multi = document.getElementById("multi");
    const topoVelas = document.getElementById("topoVelas");
    const historico = document.getElementById("historico");
    const contadorLike = document.getElementById("contadorLike");
    const coracao = document.getElementById("coracao");
    const btnLike = document.getElementById("btnLike");
    const tipoAviator = document.getElementById("tipoAviator");

    let likes = 0;
    let idTimer = null;
    let listaVelas = [];

    function curtir() {
        likes++;
        contadorLike.innerText = likes;
        coracao.innerText = "❤️";
        btnLike.classList.add("ativo");
    }

    function atualizarVelasTopo() {
        topoVelas.innerHTML = "";
        listaVelas.forEach(v => {
            const span = document.createElement("span");
            span.className = "v";
            if (v < 2.00) span.classList.add("azul");
            else if (v < 10.00) span.classList.add("roxo");
            else span.classList.add("rosa");
            span.innerText = v.toFixed(2)+"x";
            topoVelas.appendChild(span);
        })
    }

    function resetarAviao() {
        aviao.style.left = "30px";
        aviao.style.bottom = "30px";
        multi.innerText = "0.00x";
    }

    function animarAviao(valorFinal) {
        resetarAviao();
        setTimeout(()=>{
            aviao.style.left = "320px";
            aviao.style.bottom = "260px";
            multi.innerText = valorFinal.toFixed(2)+"x";
        }, 100);
    }

    function gerarSinal() {
        let min, max;
        const escolha = tipoAviator.value;

        if (escolha === "Aviator 1") { min = 1.10; max = 10.00; }
        else if (escolha === "Aviator 2") { min = 1.10; max = 12.00; }
        else if (escolha === "VIP") { min = 1.50; max = 15.00; }
        else if (escolha === "Demo") { min = 1.10; max = 8.00; }
        else { min = 1.10; max = 10.00; }

        const num = (Math.random() * (max - min) + min).toFixed(2);
        const numeroFloat = parseFloat(num);

        animarAviao(numeroFloat);

        listaVelas.unshift(numeroFloat);
        if (listaVelas.length > 10) listaVelas.pop();
        atualizarVelasTopo();

        const hora = new Date().toLocaleTimeString("pt-BR");
        const linha = document.createElement("div");
        linha.className = "item";
        linha.innerText = `${hora} | ${escolha || "Não selecionado"} | ${num}x`;
        historico.prepend(linha);
    }

    function iniciarAutomatico() {
        if (idTimer) return;
        gerarSinal();
        idTimer = setInterval(gerarSinal, 10000);
    }

    function pararAutomatico() {
        clearInterval(idTimer);
        idTimer = null;
    }

    function apagarTudo() {
        historico.innerHTML = "";
        listaVelas = [];
        atualizarVelasTopo();
        resetarAviao();
        pararAutomatico();
    }
</script>
</body>
</html>
